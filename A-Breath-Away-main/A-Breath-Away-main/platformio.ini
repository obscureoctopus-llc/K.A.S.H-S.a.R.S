; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default environment
default_envs = presence_xiao_esp32c6_hlk_ld2410b

[env]
framework = arduino
; platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; board_erase_flash = true
monitor_speed = 115200

lib_deps =
  Zigbee
  kosme/arduinoFFT@^2.0.0

[env:dfrobot_firebeetle2_esp32c6]
board = dfrobot_firebeetle2_esp32c6
build_flags =
    -DDEBUG_LED_ONSTATE=HIGH
    -DZIGBEE_MODE_ZCZR
    -Wl,-lesp_zb_api.zczr
    -Wl,-lzboss_stack.zczr
    -Wl,-lzboss_port.native
    ; -DCORE_DEBUG_LEVEL=5
board_build.partitions = zigbee_zczr.csv
board_erase_flash = true

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags =
    -DDEBUG_LED_ONSTATE=LOW
    -DZIGBEE_MODE_ZCZR
    -Wl,-lesp_zb_api.zczr
    -Wl,-lzboss_stack.zczr
    -Wl,-lzboss_port.native
    ; -DCORE_DEBUG_LEVEL=5
board_build.partitions = zigbee_zczr.csv
board_erase_flash = true


[env:waveshare_esp32_c6_zero]
board = waveshare_esp32_c6_zero
build_flags =
    -DDEBUG_LED_ONSTATE=LOW
    -DZIGBEE_MODE_ZCZR
    -Wl,-lesp_zb_api.zczr
    -Wl,-lzboss_stack.zczr
    -Wl,-lzboss_port.native
    ; -DCORE_DEBUG_LEVEL=5
board_build.partitions = zigbee_zczr.csv
board_erase_flash = true

[env:presence_xiao_esp32c6_hlk_ld2410b]
board = seeed_xiao_esp32c6
build_flags =
    -DDEBUG_LED_ONSTATE=LOW
    -DKASH_PRESENCE_MONITOR
    -DRADAR_MODEL_HLK_LD2410B
    -DRADAR_UART_RX_PIN=17
    -DRADAR_UART_TX_PIN=16
    -DRADAR_UART_BAUD=9600
monitor_speed = 115200
board_erase_flash = true

[env:presence_xiao_esp32c6_hlk_ld2410b_swapped_uart]
board = seeed_xiao_esp32c6
build_flags =
    -DDEBUG_LED_ONSTATE=LOW
    -DKASH_PRESENCE_MONITOR
    -DRADAR_MODEL_HLK_LD2410B
    -DRADAR_UART_RX_PIN=16
    -DRADAR_UART_TX_PIN=17
    -DRADAR_UART_BAUD=9600
monitor_speed = 115200
board_erase_flash = true

[env:presence_xiao_esp32c6_hlk_ld2410b_115200]
board = seeed_xiao_esp32c6
build_flags =
    -DDEBUG_LED_ONSTATE=LOW
    -DKASH_PRESENCE_MONITOR
    -DRADAR_MODEL_HLK_LD2410B
    -DRADAR_UART_RX_PIN=17
    -DRADAR_UART_TX_PIN=16
    -DRADAR_UART_BAUD=115200
monitor_speed = 115200
board_erase_flash = true

[env:presence_crowpanel_28_receiver]
; CrowPanel 2.8 inch boards are typically ESP32-based display modules.
; Using esp32dev as the base target keeps flashing/debugging simple in PlatformIO.
board = esp32dev
build_flags =
    -DKASH_PRESENCE_RECEIVER
    -DCROWPANEL_28
monitor_speed = 115200
board_erase_flash = true